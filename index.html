<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টাস্ক ম্যানেজার</title>
    <!-- CSS ফাইল যুক্ত করা হচ্ছে -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>আমার কাজের তালিকা</h1>
        
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="নতুন কাজ লিখুন..." required autocomplete="off">
            <button type="submit">যোগ করুন</button>
        </form>

        <ul id="todo-list">
            <!-- JavaScript এর মাধ্যমে নতুন কাজগুলো এখানে যোগ হবে -->
        </ul>
    </div>

    <!-- JavaScript ফাইল যুক্ত করা হচ্ছে -->
    <script src="script.js"></script>
</body>
</html>
